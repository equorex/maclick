<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>maclick</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { width: 500px; overflow-x: hidden; }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    .container { padding: 16px; }
    h1 { margin: 0 0 24px; }

    .status-message { display: none; padding: 8px 12px; margin-bottom: 16px; border-radius: 6px; font-size: 12px; overflow-wrap: anywhere; }
    .status-message.visible { display: block; }
    .status-message.info { background: #ebf8ff; color: #2b6cb0; }
    .status-message.success { background: #f0fff4; color: #276749; }
    .status-message.error { background: #fff5f5; color: #c53030; }

    .record-row { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .indicator { width: 10px; height: 10px; border-radius: 50%; background: #cbd5e0; }
    .indicator.recording { background: #e53e3e; }

    .edit-form { display: none; margin-top: 16px; padding: 16px; background: #f7fafc; border-radius: 8px; }
    .edit-form.visible { display: block; }
    .edit-form h3 { margin: 0 0 12px; font-size: 14px; }
    .field { display: block; margin-bottom: 8px; }
    .field-label { font-size: 12px; }
    .field-input { display: block; box-sizing: border-box; width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #cbd5e0; resize: vertical; }

    .button-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .btn-primary { flex: 1; padding: 8px; background: #319795; color: white; border: none; border-radius: 4px; }
    .btn-danger { padding: 8px 12px; background: #e53e3e; color: white; border: none; border-radius: 4px; }

    .steps-header { margin-top: 32px; }
    .steps-title { font-size: 12px; font-weight: bold; }
    .steps-list { margin-top: 8px; }
    .step-add-row { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .step-type-select { flex: 1; min-width: 0; padding: 6px; border-radius: 4px; border: 1px solid #cbd5e0; }
    .btn-add-step { padding: 6px 12px; background: #3182ce; color: white; border: none; border-radius: 4px; }

    .task-card { padding: 12px; margin-bottom: 8px; background: white; border-radius: 8px; border: 1px solid #e2e8f0; overflow-wrap: anywhere; }
    .task-description { font-size: 11px; color: #718096; margin-top: 2px; }
    .task-meta { font-size: 11px; color: #718096; margin-top: 2px; }
    .task-actions { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .task-actions button { padding: 4px 8px; color: white; border: none; border-radius: 4px; }
    .btn-run { flex: 1; background: #319795; }
    .btn-edit { flex: 0 0 140px; background: #6b46c1; }
    .btn-delete { flex: 0 0 90px; background: #e53e3e; }

    .step-row { padding: 6px; margin-bottom: 8px; background: white; border-radius: 4px; display: flex; gap: 4px; align-items: center; }
    .step-number { font-size: 12px; min-width: 16px; color: #718096; }
    .step-label { font-size: 12px; white-space: nowrap; }
    .step-input { box-sizing: border-box; flex: 1; min-width: 0; padding: 4px 6px; border-radius: 4px; border: 1px solid #cbd5e0; font-size: 12px; }
    .step-timeout { box-sizing: border-box; width: 70px; padding: 4px 6px; border-radius: 4px; border: 1px solid #cbd5e0; font-size: 12px; }
    .icon-btn { padding: 4px 6px; background: #e2e8f0; color: #2d3748; border: none; border-radius: 4px; }
    .icon-btn:disabled { opacity: 0.4; }

    .empty-list { padding: 16px; color: #718096; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>maclick</h1>

    <div id="status-message" class="status-message"></div>

    <div class="record-row">
      <div id="indicator" class="indicator"></div>
      <button id="record-btn">Record</button>
    </div>

    <h3>Tasks</h3>
    <div id="task-list"></div>

    <form id="create-task-form" class="edit-form">
      <h3>Edit task</h3>
      <label class="field">
        <span class="field-label">Name:</span>
        <input type="text" id="task-name" class="field-input" placeholder="Enter task name" required>
      </label>
      <label class="field">
        <span class="field-label">Description:</span>
        <textarea id="task-desc" class="field-input" rows="2"></textarea>
      </label>
      <label class="field">
        <span class="field-label">Default timeout (ms):</span>
        <input type="number" id="task-timeout" class="field-input" min="0">
      </label>

      <div class="steps-header">
        <span class="steps-title">Steps:</span>
        <div id="editStepsList" class="steps-list"></div>
      </div>

      <div class="step-add-row">
        <select id="step-type-select" class="step-type-select">
          <option value="click">Click</option>
          <option value="input_text">Input text</option>
          <option value="wait_element">Wait + click</option>
          <option value="wait_timeout">Pause</option>
          <option value="wait_page_load">Wait for load</option>
        </select>
        <button type="button" id="add-step-btn" class="btn-add-step">➕ Add step</button>
      </div>
      
      <div class="button-row">
        <button type="submit" class="btn-primary">Save</button>
        <button type="button" id="cancel-create-btn" class="btn-danger">Cancel</button>
      </div>
    </form>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/executor.js"></script>
  <script src="popup.js"></script>
</body>
</html>
