<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>maclick</title>
  <style>
    :root {
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: #eef2ff;
      --accent-contrast: #ffffff;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --success: #16a34a;
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.12);
      --radius: 10px;
      --radius-sm: 7px;
      --radius-pill: 999px;
      --transition: 140ms ease;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --accent: #6366f1;
        --accent-hover: #818cf8;
        --accent-soft: #1e1b4b;
        --accent-contrast: #ffffff;
        --danger: #ef4444;
        --danger-hover: #f87171;
        --success: #22c55e;
        --bg: #0f172a;
        --surface: #1e293b;
        --surface-2: #273449;
        --border: #334155;
        --border-strong: #475569;
        --text: #e2e8f0;
        --text-muted: #94a3b8;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
        --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.5);
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }

    body {
      width: 500px;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
      line-height: 1.4;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button {
      cursor: pointer;
      font: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      transition: background var(--transition), color var(--transition), border-color var(--transition), box-shadow var(--transition), transform var(--transition);
    }
    button:disabled { cursor: default; opacity: 0.5; }
    button:not(:disabled):active { transform: translateY(1px); }
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    svg { display: block; flex-shrink: 0; }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border: 3px solid var(--bg); border-radius: var(--radius-pill); }
    ::-webkit-scrollbar-track { background: transparent; }

    .app { padding: 12px; }

    .app-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .app-logo { width: 26px; height: 26px; border-radius: 6px; background: var(--surface); box-shadow: var(--shadow-sm); }
    .app-titles { display: flex; flex-direction: column; }
    .app h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
    .app-subtitle { margin: 0; font-size: 11px; color: var(--text-muted); }

    .status-message {
      display: none;
      overflow-wrap: anywhere;
      padding: 7px 10px;
      margin-bottom: 10px;
      border-radius: var(--radius-sm);
      border-left: 3px solid transparent;
      font-size: 12px;
    }
    .status-message.visible { display: block; animation: status-in var(--transition); }
    .status-message.info { background: var(--accent-soft); color: var(--accent); border-left-color: var(--accent); }
    .status-message.success { background: color-mix(in srgb, var(--success) 12%, transparent); color: var(--success); border-left-color: var(--success); }
    .status-message.error { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); border-left-color: var(--danger); }

    .permission-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      margin-bottom: 10px;
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      border-radius: var(--radius-sm);
    }
    .permission-banner[hidden] { display: none; }
    .permission-text { font-size: 12px; color: var(--accent); }
    .btn-permission { flex-shrink: 0; padding: 5px 12px; background: var(--accent); color: var(--accent-contrast); border-radius: var(--radius-pill); font-size: 12px; font-weight: 600; }
    .btn-permission:not(:disabled):hover { background: var(--accent-hover); }

    @keyframes status-in {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: none; }
    }

    .record-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
    }
    .record-info { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .record-title { font-weight: 600; }
    .record-hint { font-size: 11px; color: var(--text-muted); }

    .indicator { width: 9px; height: 9px; border-radius: 50%; background: var(--border-strong); flex-shrink: 0; transition: background var(--transition), box-shadow var(--transition); }
    .indicator.recording { background: var(--danger); animation: pulse 1.4s infinite; }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--danger) 55%, transparent); }
      70% { box-shadow: 0 0 0 8px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }

    .btn-record {
      padding: 6px 16px;
      background: var(--accent);
      color: var(--accent-contrast);
      border-radius: var(--radius-pill);
      font-weight: 600;
    }
    .btn-record:not(:disabled):hover { background: var(--accent-hover); }
    body:has(.indicator.recording) .btn-record { background: var(--danger); }
    body:has(.indicator.recording) .btn-record:not(:disabled):hover { background: var(--danger-hover); }

    .section-title { margin: 0; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }

    .last-used-section,
    .tasks-section { margin-top: 14px; }
    .last-used-section[hidden] { display: none; }
    .last-used-section .section-title { margin-bottom: 8px; }

    .tasks-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }

    .segmented { display: inline-flex; padding: 2px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-pill); }
    .segmented-btn { padding: 3px 9px; background: transparent; color: var(--text-muted); border: none; border-radius: var(--radius-pill); font-size: 11px; font-weight: 600; }
    .segmented-btn:not(.active):not(:disabled):hover { color: var(--text); }
    .segmented-btn.active { background: var(--surface); color: var(--accent); box-shadow: var(--shadow-sm); }

    #task-list { display: flex; flex-direction: column; gap: 8px; max-height: 340px; overflow-y: auto; margin: 0 -2px; padding: 0 2px 2px; }

    .task-card {
      overflow-wrap: anywhere;
      padding: 9px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      transition: box-shadow var(--transition), border-color var(--transition);
    }
    .task-card:hover { box-shadow: var(--shadow-md); border-color: var(--border-strong); }
    .task-card.is-recent { border-color: var(--accent); background: linear-gradient(0deg, var(--accent-soft), var(--surface)); }

    .task-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .task-head > strong { min-width: 0; flex: 1; font-size: 13px; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .task-description { font-size: 11px; color: var(--text-muted); margin-top: 2px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .task-meta { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

    .task-actions { display: flex; flex-wrap: wrap; gap: 4px; flex-shrink: 0; }
    .btn-icon { width: 26px; height: 26px; padding: 0; background: var(--surface-2); color: var(--text); border-color: var(--border); }
    .btn-icon:not(:disabled):hover { background: var(--border); }
    .task-actions .btn-run { background: var(--accent); color: var(--accent-contrast); border-color: transparent; }
    .task-actions .btn-run:not(:disabled):hover { background: var(--accent-hover); }
    .task-actions .btn-delete { color: var(--danger); }
    .task-actions .btn-delete:not(:disabled):hover { background: color-mix(in srgb, var(--danger) 14%, transparent); }

    .empty-list {
      margin: 0;
      padding: 20px 12px;
      color: var(--text-muted);
      text-align: center;
      background: var(--surface);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius);
      font-size: 12px;
    }

    .edit-form { animation: status-in var(--transition); }

    .field { display: block; margin-bottom: 8px; }
    .field-label { display: block; margin-bottom: 3px; font-size: 11px; font-weight: 600; color: var(--text-muted); }
    .field-input {
      display: block;
      width: 100%;
      padding: 6px 8px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      resize: vertical;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .field-input:hover { border-color: var(--accent); }

    .steps-header { margin-top: 12px; }
    .steps-title { display: block; margin-bottom: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
    .steps-list { display: flex; flex-direction: column; gap: 5px; }

    .step-add-row { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 5px; }
    .step-type-select {
      flex: 1;
      min-width: 0;
      padding: 6px 8px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
    }
    .btn-add-step { padding: 6px 10px; background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
    .btn-add-step:hover { background: var(--accent); color: var(--accent-contrast); }

    .step-row {
      padding: 5px 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
    }
    .step-row.dragging { opacity: 0.5; }
    .step-row.drag-over { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .drag-handle { display: inline-flex; color: var(--text-muted); cursor: grab; }
    .drag-handle:active { cursor: grabbing; }
    .step-number { font-size: 11px; min-width: 15px; color: var(--text-muted); font-weight: 600; text-align: right; }
    .step-type {
      flex: 0 0 auto;
      max-width: 155px;
      min-width: 0;
      padding: 4px 6px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 5px;
      font-size: 11px;
    }
    .step-input,
    .step-timeout {
      box-sizing: border-box;
      min-width: 0;
      padding: 4px 6px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 5px;
      font-size: 11px;
    }
    .step-input { flex: 1; }
    .step-timeout { width: 62px; }

    .icon-btn { padding: 4px; background: var(--surface); color: var(--text-muted); border-color: var(--border); }
    .icon-btn:not(:disabled):hover { color: var(--text); border-color: var(--border-strong); }
    .icon-btn:disabled { opacity: 0.35; }

    .button-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .btn-primary { flex: 1; padding: 8px; background: var(--accent); color: var(--accent-contrast); font-weight: 600; border-radius: var(--radius-sm); }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { padding: 8px 12px; background: var(--surface-2); color: var(--text); border-color: var(--border); font-weight: 600; }
    .btn-secondary:hover { background: var(--border); }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <img class="app-logo" src="icons/icon48.svg" alt="">
      <div class="app-titles">
        <h1>maclick</h1>
        <p class="app-subtitle">Record &amp; replay macros</p>
      </div>
    </header>

    <div id="permission-banner" class="permission-banner" hidden>
      <span class="permission-text">maclick needs site access to record and replay actions.</span>
      <button id="grant-permission-btn" type="button" class="btn-permission">Allow access</button>
    </div>

    <div id="status-message" class="status-message"></div>

    <section class="record-card">
      <div class="record-info">
        <div id="indicator" class="indicator"></div>
        <div>
          <div class="record-title">Recorder</div>
          <div id="record-hint" class="record-hint">Idle</div>
        </div>
      </div>
      <button id="record-btn" type="button" class="btn-record">Record</button>
    </section>

    <section id="last-used-section" class="last-used-section" hidden>
      <h3 class="section-title">Last used</h3>
      <div id="last-used-task"></div>
    </section>

    <section class="tasks-section">
      <div class="tasks-header">
        <h3 class="section-title">Tasks</h3>
        <div id="domain-filter" class="segmented" role="group" aria-label="Task filter">
          <button type="button" class="segmented-btn" data-filter="domain" aria-pressed="true">This domain</button>
          <button type="button" class="segmented-btn" data-filter="all" aria-pressed="false">All</button>
        </div>
      </div>
      <div id="task-list"></div>
    </section>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/executor.js"></script>
  <script src="popup.js"></script>
</body>
</html>
